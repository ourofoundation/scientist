[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist"
version = "0.2.0"
description = "AI Scientist for rare-earth-free permanent magnets via GGen chemical-system exploration"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Matt Moderwell", email = "matt@ouro.foundation" }]
dependencies = [
    "dspy-ai>=2.0.0",
    "numpy>=1.24",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "ouro-py>=0.3.8",
    "pymatgen>=2024.12.1",
    "mlflow>=2.21.1",
    "pandas>=2.2.2",
    "requests>=2.25.0",
]

[project.scripts]
scientist = "scientist.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scientist*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
"Repository" = "https://github.com/ourofoundation/scientist"
"Issues" = "https://github.com/ourofoundation/scientist/issues"
