[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist"
version = "0.3.0"
description = "AI Scientist: LLM-guided annealing search over materials using Ouro routes"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Matt Moderwell", email = "matt@ouro.foundation" }]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "ouro-py>=2.0.0",
    "websocket-client>=1.6.0",
    "pandas>=2.2.2",
    "requests>=2.25.0",
]

[project.scripts]
scientist = "scientist.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scientist*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
"Repository" = "https://github.com/ourofoundation/scientist"
"Issues" = "https://github.com/ourofoundation/scientist/issues"
